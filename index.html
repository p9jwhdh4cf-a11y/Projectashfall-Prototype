<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>PROJECT ASHFALL – Kamera-Prototyp</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141e1d;color:#fff;font:14px system-ui;touch-action:none}canvas{width:100%;height:100%;display:block}#info{position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;pointer-events:none;text-shadow:0 2px 4px #000}#info b{letter-spacing:2px;color:#f0ce8d}#info small{display:block;margin-top:5px;opacity:.85}#pad{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:24px;width:125px;height:125px;border:2px solid #fff8;background:#ffffff1c;border-radius:50%;touch-action:none}#nub{position:absolute;width:52px;height:52px;left:35px;top:35px;border-radius:50%;background:#ffffff9a;border:2px solid white}#run{position:absolute;right:24px;bottom:max(45px,env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;background:#ae6544df;border:2px solid #f7c88c;color:white;font-weight:800;touch-action:none}#fps{position:absolute;right:15px;top:max(15px,env(safe-area-inset-top));font-size:12px}#hint{position:absolute;bottom:max(160px,env(safe-area-inset-bottom) + 140px);left:15px;right:15px;text-align:center;font-size:12px;color:#f0e6c9;text-shadow:0 2px 3px #000;pointer-events:none}</style></head><body><canvas id="c"></canvas><div id="info"><b>PROJECT ASHFALL</b><small>GRAFIK- & KAMERA-PROTOTYP · keine Spielstände verändert</small></div><div id="fps"></div><div id="hint">Feste schräge Kamera · Joystick zum Bewegen · LAUFEN für Sprint</div><div id="pad"><div id="nub"></div></div><button id="run">LAUFEN</button><script>
'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false}),pad=document.getElementById('pad'),nub=document.getElementById('nub'),run=document.getElementById('run'),fps=document.getElementById('fps');let W=0,H=0,dpr=1,moveX=0,moveY=0,sprint=false,joyId=null,px=0,py=0,last=performance.now(),frames=0,fpsTime=last,displayFps=0;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function joy(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),f=Math.min(1,m/43),a=Math.atan2(dy,dx);moveX=Math.cos(a)*f;moveY=Math.sin(a)*f;nub.style.transform=`translate(${moveX*37}px,${moveY*37}px)`}pad.addEventListener('pointerdown',e=>{joyId=e.pointerId;pad.setPointerCapture(joyId);joy(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joy(e)});function release(e){if(e.pointerId!==joyId)return;joyId=null;moveX=moveY=0;nub.style.transform='translate(0,0)'}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);run.addEventListener('pointerdown',e=>{run.setPointerCapture(e.pointerId);sprint=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])run.addEventListener(ev,()=>sprint=false);let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const buildings=[{x:-480,y:-330,w:270,h:195,hgt:105,wall:'#9b9985',roof:'#625f5b'},{x:250,y:-370,w:250,h:205,hgt:95,wall:'#96917c',roof:'#696451'},{x:-460,y:210,w:250,h:210,hgt:110,wall:'#898f83',roof:'#56645d'},{x:290,y:240,w:230,h:180,hgt:90,wall:'#9e8974',roof:'#6b5d50'}];let seed=1337;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const decor=[];for(let i=0;i<110;i++){const x=(rnd()-.5)*1850,y=(rnd()-.5)*1550;if(Math.abs(x)<120||Math.abs(y)<95)continue;if(buildings.some(b=>x>b.x-30&&x<b.x+b.w+30&&y>b.y-30&&y<b.y+b.h+30))continue;decor.push({x,y,type:rnd()<.45?'tree':rnd()<.55?'rock':'bush',scale:.75+rnd()*.7})}const zombies=[{x:130,y:-110},{x:-190,y:140},{x:530,y:130},{x:-540,y:-80}];const car={x:-45,y:-180};
// Fixed angled projection: ground coordinates are rotated and vertically compressed.
const A=Math.PI/4,cs=Math.cos(A),sn=Math.sin(A),tilt=.58;let scale=1,ox=0,oy=0;function project(x,y,z=0){const dx=x-px,dy=y-py;return {x:ox+(dx*cs-dy*sn)*scale,y:oy+((dx*sn+dy*cs)*tilt-z)*scale}}function polygon(points,color,stroke){ctx.beginPath();points.forEach((p,i)=>{const q=project(...p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}function line(points,color,width=1){ctx.beginPath();points.forEach((p,i)=>{const q=project(...p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.strokeStyle=color;ctx.lineWidth=width*scale;ctx.stroke()}function box(x,y,w,h,z,c,top,shade){polygon([[x,y,0],[x+w,y,0],[x+w,y+h,0],[x,y+h,0]],'#20292455');polygon([[x,y,0],[x+w,y,0],[x+w,y,z],[x,y,z]],shade||'#6e7568');polygon([[x+w,y,0],[x+w,y+h,0],[x+w,y+h,z],[x+w,y,z]],c);polygon([[x,y+h,0],[x+w,y+h,0],[x+w,y+h,z],[x,y+h,z]],c);polygon([[x,y,z],[x+w,y,z],[x+w,y+h,z],[x,y+h,z]],top,'#ffffff18')}
function house(b){box(b.x,b.y,b.w,b.h,b.hgt,b.wall,b.roof,'#74766b');polygon([[b.x-9,b.y-9,b.hgt],[b.x+b.w+9,b.y-9,b.hgt],[b.x+b.w+9,b.y+b.h+9,b.hgt],[b.x-9,b.y+b.h+9,b.hgt]],b.roof,'#2b342c');const dx=b.x+b.w*.43;polygon([[dx,b.y+b.h+1,0],[dx+44,b.y+b.h+1,0],[dx+44,b.y+b.h+1,69],[dx,b.y+b.h+1,69]],'#393d38');polygon([[b.x+35,b.y+b.h+2,36],[b.x+88,b.y+b.h+2,36],[b.x+88,b.y+b.h+2,72],[b.x+35,b.y+b.h+2,72]],'#799a9a','#343c37')}
function tree(o){const {x,y}=o,s=o.scale;box(x-7*s,y-7*s,14*s,14*s,47*s,'#594b38','#665540');polygon([[x-38*s,y-28*s,43*s],[x+33*s,y-25*s,43*s],[x+45*s,y+30*s,43*s],[x-35*s,y+30*s,43*s]],'#364d3c');polygon([[x-31*s,y-24*s,72*s],[x+25*s,y-19*s,72*s],[x+34*s,y+23*s,72*s],[x-29*s,y+23*s,72*s]],'#45624a');polygon([[x-18*s,y-14*s,91*s],[x+16*s,y-13*s,91*s],[x+20*s,y+17*s,91*s],[x-16*s,y+17*s,91*s]],'#567452')}
function person(x,y,shirt,skin='#c8ab8b',size=1){const r=10*size;polygon([[x-8*size,y-7*size,0],[x+9*size,y-7*size,0],[x+10*size,y+9*size,0],[x-8*size,y+9*size,0]],'#0005');box(x-7*size,y-5*size,5*size,9*size,22*size,'#323d43','#39484d');box(x+3*size,y-5*size,5*size,9*size,22*size,'#323d43','#39484d');box(x-r,y-r,2*r,2*r,47*size,shirt,shirt,'#344f47');box(x-6*size,y-6*size,12*size,12*size,62*size,skin,skin);box(x-7*size,y-7*size,14*size,14*size,67*size,'#37372e','#45433a')}
function draw(){ctx.fillStyle='#52634d';ctx.fillRect(0,0,W,H);scale=Math.max(.48,Math.min(.9,W/480));ox=W*.5;oy=H*.49;const area=1200;polygon([[-area,-area,0],[area,-area,0],[area,area,0],[-area,area,0]],'#617158');polygon([[-area,-76,1],[area,-76,1],[area,76,1],[-area,76,1]],'#5e5f5b');polygon([[-80,-area,1],[80,-area,1],[80,area,1],[-80,area,1]],'#5e5f5b');for(let t=-1100;t<=1100;t+=90){line([[t,-3,2],[t+45,-3,2]],'#b5b0a077',3);line([[-3,t,2],[-3,t+45,2]],'#b5b0a077',3)}const objects=[];for(const b of buildings)objects.push({depth:b.x+b.y+b.w+b.h,fn:()=>house(b)});for(const o of decor)objects.push({depth:o.x+o.y,fn:()=>{if(o.type==='tree')tree(o);else if(o.type==='rock')box(o.x-11,o.y-8,23,17,9,'#777c72','#a4a69a');else box(o.x-17,o.y-14,34,28,16,'#456747','#527b50')}});objects.push({depth:car.x+car.y+110,fn:()=>{box(car.x,car.y,105,52,21,'#704d45','#a76650');box(car.x+21,car.y+7,60,38,36,'#677c7c','#7c9999')}});for(const z of zombies)objects.push({depth:z.x+z.y,fn:()=>person(z.x,z.y,'#6b755e','#91a18b',.95)});objects.push({depth:px+py,fn:()=>person(px,py,'#c78b4e','#d8b696',1.08)});objects.sort((a,b)=>a.depth-b.depth);for(const o of objects)o.fn();const center=project(px,py,0);ctx.beginPath();ctx.ellipse(center.x,center.y+2,15*scale,8*scale,0,0,Math.PI*2);ctx.strokeStyle='#f7d99a';ctx.lineWidth=2;ctx.stroke()}
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;let mx=moveX,my=moveY;if(keys.w||keys.arrowup)my-=1;if(keys.s||keys.arrowdown)my+=1;if(keys.a||keys.arrowleft)mx-=1;if(keys.d||keys.arrowright)mx+=1;const len=Math.hypot(mx,my);if(len>.05){mx/=Math.max(1,len);my/=Math.max(1,len);const speed=sprint||keys.shift?230:130;const dx=(mx*cs+my*sn)*speed*dt,dy=(-mx*sn+my*cs)*speed*dt;const nx=px+dx,ny=py+dy;const blocked=(x,y)=>buildings.some(b=>x>b.x-15&&x<b.x+b.w+15&&y>b.y-15&&y<b.y+b.h+15);if(!blocked(nx,py))px=nx;if(!blocked(px,ny))py=ny}draw();frames++;if(now-fpsTime>=900){displayFps=Math.round(frames*1000/(now-fpsTime));fps.textContent=displayFps+' FPS';frames=0;fpsTime=now}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
